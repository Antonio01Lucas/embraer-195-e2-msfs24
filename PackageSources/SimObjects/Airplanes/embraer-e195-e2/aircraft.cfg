; Ref: MSFS 2024 SDK - aircraft.cfg
; Identificação oficial da aeronave. Dados ICAO cross-checados em
; dados-tecnicos-extraidos.md (doc8643.com / FAA Order JO 7360.1E).
;
; PENDÊNCIAS (não fabricadas — deixadas explícitas em vez de "chutadas"):
;   - model/ agora existe (greybox de bloqueio de volume - ver
;     tools/blender/generate_greybox.py), mas é só um placeholder de
;     forma/dimensão, sem textura e sem interior/cockpit real.
;   - sound folder: ainda não existe (Fase 3 do roadmap).
;   - manifest.json/layout.json do pacote MSFS ainda não existem. Conforme
;     a documentação oficial do SDK, esses dois arquivos são GERADOS pelo
;     Package Tool / Project Editor a partir de um projeto de Package
;     Definitions (ver embraer-e195-e2-msfs24.xml na raiz do repo) — não
;     são para editar/fabricar à mão. Falta rodar esse projeto pelo
;     Project Editor (MSFS 2024 Developer Mode) ou pelo Package Tool
;     standalone do SDK para o pacote ser reconhecido pelo simulador.

