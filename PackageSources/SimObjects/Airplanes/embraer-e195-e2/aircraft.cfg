; Ref: MSFS 2024 SDK - aircraft.cfg
; Identificação oficial da aeronave. Dados ICAO cross-checados em
; dados-tecnicos-extraidos.md (doc8643.com / FAA Order JO 7360.1E).
;
; PENDÊNCIAS (não fabricadas — deixadas explícitas em vez de "chutadas"):
;   - model / panel / sound folders: apontam para diretórios que ainda não
;     existem (modelo 3D é a Fase 4 do roadmap; ver
;     roadmap-desenvolvimento-fases.md). aircraft.cfg não carrega no MSFS
;     sem um modelo 3D mínimo — isso é esperado nesta fase de scaffolding.
;   - manifest.json do pacote MSFS ainda não foi criado (não fazia parte do
;     escopo desta execução) — necessário para o pacote ser reconhecido
;     pelo simulador.

