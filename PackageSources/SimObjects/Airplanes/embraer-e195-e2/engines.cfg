; Ref: MSFS 2024 SDK - engines.cfg
; Motor: Pratt & Whitney PW1900G (Geared Turbofan). Dados cross-checados em
; dados-tecnicos-extraidos.md (PlaneFYI + MTU Aero Engines). Variante de
; maior empuxo da família (usada no E195-E2): ~102-104,5 kN / ~23.000-23.500 lbf.
;
; REGRA DE CONDUTA #1 ("Física em Primeiro Lugar"): curvas de resposta do
; FADEC (N1/N2/Ng por regime, altitude, Mach, ISA) são dado proprietário
; (ver dados-tecnicos-extraidos.md, lacuna #3) — NÃO fabricadas aqui.
; Populados apenas os parâmetros físicos estáticos com fonte confirmada.

[TURBINEENGINEDATA]
engine_type = 1                    ; 1 = Jet (MSFS SDK)

; Ref: dados-tecnicos-extraidos.md - PlaneFYI/MTU (variante de maior
; empuxo da família PW1900G, usada no E195-E2).
static_thrust = 23500              ; lbf (~104,5 kN)

; Ref: dados-tecnicos-extraidos.md - MTU Aero Engines / PlaneFYI.
bypass_ratio = 12.0                ; adimensional (~12:1, GTF)

; Ref: dados-tecnicos-extraidos.md - PlaneFYI.
fan_diameter = 6.1                 ; ft (1,854 m / 73 in)

; Ref: dados-tecnicos-extraidos.md - PlaneFYI (peso seco do motor, usado
; futuramente para W&B/inércia distribuída por nacele).
engine_dry_weight = 5996           ; lb (2.720 kg)

; --- Parâmetros de regime (N1/N2/EGT) -------------------------------------
; TODO(Fase 1 - bloqueante): valores reais de N1 idle/max, N2 idle/max,
; EGT limites (start/continuous/takeoff), e fuel_flow_gain dependem de
; dados FADEC proprietários (AMM/FCOM). Os placeholders abaixo são
; ESTIMATIVAS DE ENGENHARIA baseadas em faixas típicas de turbofans GTF de
; classe similar (CFM LEAP-1A / PW1000G family, dado público de
; engenharia comparativa) — não são o dado certificado do PW1900G.
; Substituir assim que dados reais (ou validação via ADS-B/telemetria de
; voo real, conforme inventario-dados-e-viabilidade.md seção 4) estiverem
; disponíveis.
n1_idle_percent = 20.0             ; ESTIMADO
n1_max_percent = 100.0             ; ESTIMADO
n2_idle_percent = 60.0             ; ESTIMADO
n2_max_percent = 100.0             ; ESTIMADO
egt_max_celsius = 950.0            ; ESTIMADO

; --- Reversor de empuxo ----------------------------------------------------
; Ref: roadmap-sistemas-ata.md (ATA 73/76/78) - atuação hidráulica com
; travas de segurança mecânicas (ver PowerplantSystem.h).
reverser_available = 1
reverser_max_thrust_percent = 0.0  ; TODO(Fase 1): percentual real de
                                    ; empuxo reverso disponível — não
                                    ; confirmado publicamente.

; TODO(Fase 1): seção [FUEL] (fuel_flow_gain real), [PISTON_ENGINE] N/A
; (motor é turbofan), e tabelas de correção de empuxo por altitude/Mach/ISA
; — a desenvolver com base em dados de voo real (ADS-B) para validação,
; conforme metodologia registrada em inventario-dados-e-viabilidade.md.
