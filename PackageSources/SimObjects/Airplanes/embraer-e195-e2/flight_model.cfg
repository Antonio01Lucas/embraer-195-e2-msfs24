; Ref: MSFS 2024 SDK - flight_model.cfg
; Parâmetros geométricos e inerciais. Fonte primária dos dados numéricos:
; dados-tecnicos-extraidos.md (Projeto "Embraer 195 E2") — cross-check entre
; folheto oficial Embraer, Wikipedia (E-Jet E2 family) e doc8643.com.
;
; REGRA DE CONDUTA DO PROJETO #1 ("Física em Primeiro Lugar"): nenhum valor
; abaixo é inventado sem base. Onde o dado certificado real (TCDS/AFM/WBM)
; ainda não foi obtido, o valor é uma ESTIMATIVA DE ENGENHARIA com método
; citado explicitamente — não um número arbitrário. Ver
; dados-tecnicos-extraidos.md, seção "Lacunas confirmadas".

[VERSION]
ATCMODEL = "E295"
ATCSUFFIX = ""

[WEIGHT_AND_BALANCE]
; Ref: dados-tecnicos-extraidos.md - folheto oficial Embraer "Profit Hunter".
max_gross_weight = 137789        ; lb (62.500 kg, MTOW)
empty_weight = 78705              ; lb (35.700 kg, OEW - fonte: Wikipedia,
                                   ; cross-check pendente contra TCDS/WBM real)

; CG: Sem WBM (Weight and Balance Manual) real disponível, a posição de CG
; vazio e os limites fwd/aft NÃO podem ser fabricados com precisão — isso
; seria inventar um dado estrutural crítico sem base. Mantidos como TODO
; explícito em vez de um placeholder numérico enganoso.
; TODO(Fase 1 - bloqueante para tuning real de W&B): obter WBM ou TCDS
; completo (dados-tecnicos-extraidos.md, lacuna #5) antes de preencher:
;   empty_weight_CG_position
;   CG_forward_limit
;   CG_aft_limit

; Ref: metodologia Roskam (Airplane Design, Part V, Cap. 10) para
; estimativa de raio de giração em jatos de transporte, na ausência de
; dados reais de W&B. Rx ≈ 0,25*envergadura; Ry ≈ 0,33*comprimento;
; Rz ≈ 0,34*comprimento. Calculado a partir da geometria real (ver
; [AIRPLANE_GEOMETRY] abaixo): b = 35,12 m, l = 41,51 m.
;   Rx = 0,25 * 35,12 m = 8,78 m = 28,8 ft
;   Ry = 0,33 * 41,51 m = 13,70 m = 44,9 ft
;   Rz = 0,34 * 41,51 m = 14,11 m = 46,3 ft
; ESTIMATIVA — substituir por dado real assim que TCDS/WBM completo for
; obtido (ver dados-tecnicos-extraidos.md, lacuna #2).
radius_of_gyration = 28.8, 44.9, 46.3   ; ft (x, y, z)

[AIRPLANE_GEOMETRY]
; Ref: dados-tecnicos-extraidos.md - cross-check Wikipedia + doc8643.com.
wing_area = 1110.0        ; ft² (103 m²)
wing_span = 115.25         ; ft (35,12 m)
wing_root_chord = 0.0      ; TODO(Fase 1): geometria detalhada de asa
                            ; (root/tip chord, enflechamento) requer dados
                            ; de projeto aerodinâmico não publicados —
                            ; a derivar de análise de fotos/desenhos 3-view
                            ; oficiais quando disponíveis, não de "chute".
wing_dihedral = 0.0        ; TODO(Fase 1): idem acima.
wing_sweep = 0.0           ; TODO(Fase 1): idem acima — ângulo de
                            ; enflechamento não confirmado publicamente.
aspect_ratio = 11.97       ; Ref: Wikipedia (E-Jet E2 family)

fuselage_length = 136.17   ; ft (41,51 m)
fuselage_height = 35.83    ; ft (10,91 m) — nota: esta é a ALTURA total da
                            ; aeronave (empenagem), não a altura da fuselagem
                            ; isolada; usar como referência até dado mais
                            ; preciso estar disponível.

[REFERENCE SPEEDS]
; Ref: dados-tecnicos-extraidos.md - MMO conforme folheto Embraer (Max
; Cruise Speed M0.82). V-speeds de baixa velocidade (VS0, VS1, VFE, VNO,
; VNE) dependem de dados de certificação (TCDS) ainda não extraídos na
; íntegra — ver dados-tecnicos-extraidos.md, lacuna #1. NÃO preenchidos
; para evitar apresentar número fabricado como se fosse certificado.
max_mach = 0.82

; TODO(Fase 1 - bloqueante): as seções abaixo (aerodinâmica de fato:
; polar de arrasto, curvas de sustentação, coeficientes de superfícies de
; comando, [FLAPS.0..N], [CONTACT_POINTS], [PROPELLER]/[JET_ENGINE] tuning
; fino) exigem tanto o TCDS completo quanto dados de voo real (ADS-B) para
; validação cruzada, conforme metodologia descrita em
; inventario-dados-e-viabilidade.md, seção 4. Serão desenvolvidas na
; Fase 1 do roadmap (roadmap-desenvolvimento-fases.md), não fabricadas
; agora só para "preencher" o arquivo.
